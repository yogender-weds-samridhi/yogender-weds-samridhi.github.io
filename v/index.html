<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Virk Complex · Directions</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#30031C">
<script>
  (function () {
    var google = "https://maps.google.com/?cid=6595423189083607150", apple = "https://maps.apple.com/?q=Virk%20Complex&ll=29.6859657,76.9313847";
    var ua = navigator.userAgent || '';
    // iPhone / iPod / iPad (iPadOS reports itself as a Mac with a touch screen)
    var isApple = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    window.__target = isApple ? apple : google;
    if (location.hash !== '#stay') location.replace(window.__target);
  })();
</script>
<style>
  :root { --plum: #30031C; --plum-2: #4A0A2C; --cream: #FFE3BE; --cream-soft: #E8C8A4; --gold: #D6B06A; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh; display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(90% 60% at 50% 30%, var(--plum-2), var(--plum) 70%); color: var(--cream);
    font-family: "Cormorant Garamond", Garamond, Georgia, "Times New Roman", serif; text-align: center;
  }
  main { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .om { font-size: 34px; line-height: 1; color: var(--gold); }
  .event { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0; }
  h1 { font-size: 30px; font-weight: 600; margin: 0; line-height: 1.15; }
  .addr { font-size: 17px; color: var(--cream-soft); margin: 0 0 6px; }
  .status { font-style: italic; font-size: 16px; color: var(--cream-soft); margin: 0; min-height: 1.3em; }
  .btns { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 6px; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; border-radius: 999px; text-decoration: none;
    font-family: Georgia, serif; font-weight: 700; font-size: 16px; letter-spacing: .02em;
  }
  a.primary { background: linear-gradient(135deg, #F7DFA9, #D6B06A); color: var(--plum); }
  a.secondary { border: 1px solid rgba(255,227,190,.45); color: var(--cream); }
  a.btn:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<main>
  <div class="om" aria-hidden="true">ॐ</div>
  <p class="event">Baraat · Thursday, 12 November 2026 · 8:00 am</p>
  <h1>Virk Complex</h1>
  <p class="addr">Kaithal Road, Karnal</p>
  <p class="status" id="status">Opening maps…</p>
  <div class="btns">
    <a class="btn primary" id="google" href="https://maps.google.com/?cid=6595423189083607150"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>Open in Google Maps</a>
    <a class="btn secondary" id="apple" href="https://maps.apple.com/?q=Virk%20Complex&amp;ll=29.6859657,76.9313847"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>Open in Apple Maps</a>
  </div>
</main>
<script>
  (function () {
    // put the likely app first; if the automatic jump did not happen, these buttons do the same thing
    if (window.__target && window.__target.indexOf('maps.apple.com') !== -1) {
      var g = document.getElementById('google'), a = document.getElementById('apple');
      a.className = 'btn primary'; g.className = 'btn secondary'; a.parentNode.insertBefore(a, g);
    }
    setTimeout(function () { document.getElementById('status').textContent = 'If your maps app did not open, tap a button below.'; }, 1800);
  })();
</script>
</body>
</html>
